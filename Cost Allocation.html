  const tPaid = new Array(CHK + 1).fill(null); tPaid[1] = xstr("Paid (out of pocket)", 5); tPaid[3] = xnum(grand, 4); people.forEach((p) => (tPaid[PC0 + p.i] = xnum(byId[p.id].paid, 4))); ex.push(tPaid);

  const exCols = [6, 26, 14, 12, 10].concat(people.map(() => 12)).concat([10]);

  const bal = [[xstr("Party", 1), xstr("Paid", 1), xstr("Share", 1), xstr("Net Payable / (Receivable)", 1), xstr("Status", 1)]];
  rows.forEach((r) => { const st = r.net > 0.005 ? `Owes ${fmt(r.net)}` : r.net < -0.005 ? `Receives ${fmt(-r.net)}` : "Settled"; bal.push([xstr(r.name), xnum(r.paid, 2), xnum(r.share, 2), xnum(r.net, 3), xstr(st)]); });

function exportXlsx() {
  if (!state.expenses.length) return;
  try {
    const bytes = buildWorkbookBytes();
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `cost-allocation-${stamp}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) { alert("Sorry, the export failed. " + (e && e.message ? e.message : "")); }
}

/* ---------- shared download helpers ---------- */

function download(blob, name) {
  const url = URL.createObjectURL(blob);

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ---------- render summary to a canvas (for JPEG/PDF) ---------- */
async function renderReportCanvas() {
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  const people = state.people.map((p, i) => ({ ...p, i }));
  const rows = computeTotals(people, state.expenses);
  const settle = computeSettlement(rows);
  const total = round2(state.expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0));
  const maxAbs = Math.max(1, ...rows.map((r) => Math.abs(r.net)));

  const W = 760, pad = 44, x0 = pad, cw = W - 2 * pad;
  const headerH = 172, secGap = 28, secLabelH = 42, balRow = 64, payRow = 56, sVpad = 16;
  const balBlockH = sVpad * 2 + rows.length * balRow;
  const payBlockH = sVpad * 2 + Math.max(1, settle.length) * payRow;
  const H = 32 + headerH + secGap + secLabelH + balBlockH + secGap + secLabelH + payBlockH + 60;

  const DPR = 2;
  const cv = document.createElement("canvas"); cv.width = W * DPR; cv.height = H * DPR;
  const ctx = cv.getContext("2d"); ctx.scale(DPR, DPR);

  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  const dstr = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  let y = 32;

  const g = ctx.createLinearGradient(x0, y, x0 + cw, y + headerH);
  g.addColorStop(0, "#1c2650"); g.addColorStop(.6, "#243069"); g.addColorStop(1, "#2f3fb0");
  ctx.fillStyle = g; rr(ctx, x0, y, cw, headerH, 24); ctx.fill();
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.fillStyle = "#c3caf5"; ctx.font = "500 15px " + IN; ctx.fillText("Cost Allocation", x0 + 28, y + 42);
  ctx.fillStyle = "#FFFFFF"; ctx.font = "600 52px " + SG; ctx.fillText(fmt(total), x0 + 26, y + 102);
  ctx.fillStyle = "#c8cef2"; ctx.font = "400 15px " + IN;
  ctx.fillText(`Split between ${people.length} ${people.length === 1 ? "person" : "people"} across ${state.expenses.length} ${state.expenses.length === 1 ? "expense" : "expenses"}.`, x0 + 28, y + 140);
  ctx.font = "500 13px " + IN; ctx.fillStyle = "#aeb6e6"; ctx.textAlign = "right";
  ctx.fillText(dstr, x0 + cw - 26, y + 42); ctx.textAlign = "left";
  y += headerH + secGap;

  ctx.fillStyle = "#17203A"; ctx.font = "600 20px " + SG; ctx.fillText("Who owes what", x0, y + 8); y += secLabelH - 8;
  ctx.fillStyle = "#F4F6FA"; rr(ctx, x0, y, cw, balBlockH, 18); ctx.fill();

    ctx.fillStyle = avColor(r.i); ctx.beginPath(); ctx.arc(x0 + 26, cy, 18, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "600 15px " + SG; ctx.textAlign = "center"; ctx.fillText(initials(r.name), x0 + 26, cy + 1); ctx.textAlign = "left";
    ctx.fillStyle = "#17203A"; ctx.font = "500 17px " + IN; ctx.fillText(r.name, x0 + 56, cy - 9);
    const barW = cw - 56 - 200, w = (Math.abs(r.net) / maxAbs) * barW;
    ctx.fillStyle = "#E4E7EF"; rr(ctx, x0 + 56, cy + 10, barW, 6, 3); ctx.fill();
    if (w > 0) { ctx.fillStyle = owes ? "#E5484D" : gets ? "#0F9E8E" : "#C9CEDD"; rr(ctx, x0 + 56, cy + 10, Math.max(w, 3), 6, 3); ctx.fill(); }
    ctx.textAlign = "right";
    ctx.fillStyle = owes ? "#E5484D" : gets ? "#0F9E8E" : "#9AA1BD"; ctx.font = "600 18px " + SG;
    ctx.fillText(owes ? fmt(r.net) : gets ? fmt(-r.net) : fmt(0), x0 + cw - 20, cy - 8);
    ctx.fillStyle = "#737C9E"; ctx.font = "500 12px " + IN;

      ctx.textAlign = "right"; ctx.font = "600 17px " + SG; ctx.fillText(fmt(t.amount), x0 + cw - 20, cy);

}

/* ---------- minimal PDF around a JPEG (no libraries) ---------- */
function buildPdf(jpeg, iw, ih, pw, ph) {
  const enc = new TextEncoder(); const parts = []; let len = 0; const offs = {};
  const push = (u8) => { parts.push(u8); len += u8.length; };
  const pushStr = (s) => push(enc.encode(s));
  pushStr("%PDF-1.4\n");
  offs[1] = len; pushStr("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  offs[2] = len; pushStr("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  offs[3] = len; pushStr(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  offs[4] = len; pushStr(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg); pushStr("\nendstream\nendobj\n");
  const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  offs[5] = len; pushStr(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xrefOff = len;
  let xref = "xref\n0 6\n0000000000 65535 f \n";
  for (let i = 1; i <= 5; i++) xref += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  pushStr(xref);
  pushStr(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOff}\n%%EOF`);
  let total = 0; for (const p of parts) total += p.length; const out = new Uint8Array(total); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out;
}

async function exportJpeg() {
  if (!state.expenses.length) return;
  try {
    const cv = await renderReportCanvas();
    cv.toBlob((blob) => { if (!blob) { alert("Could not create the image."); return; } download(blob, `cost-allocation-${stamp()}.jpg`); }, "image/jpeg", 0.95);
  } catch (e) { alert("Sorry, the image export failed. " + (e && e.message ? e.message : "")); }
}
async function exportPdf() {
  if (!state.expenses.length) return;
  try {
    const cv = await renderReportCanvas();
    const jpeg = dataUrlToBytes(cv.toDataURL("image/jpeg", 0.95));
    const iw = cv.width, ih = cv.height, pw = 595, ph = Math.round(pw * ih / iw);
    download(new Blob([buildPdf(jpeg, iw, ih, pw, ph)], { type: "application/pdf" }), `cost-allocation-${stamp()}.pdf`);
  } catch (e) { alert("Sorry, the PDF export failed. " + (e && e.message ? e.message : "")); }
}

/* ---------- mutations ---------- */
function commit(fn) { fn(); save(); renderApp(); }
function addPerson(name) { commit(() => state.people.push({ id: uid(), name })); }
function renamePerson(id, name) { commit(() => { const p = state.people.find((x) => x.id === id); if (p) p.name = name; }); }
function deletePerson(id) {
  commit(() => {
    state.expenses = state.expenses.filter((e) => e.paidBy !== id).map((e) => {
      const c = { ...e };
      if (c.participants) { c.participants = { ...c.participants }; delete c.participants[id]; }
      if (c.amounts) { c.amounts = { ...c.amounts }; delete c.amounts[id]; }
      return c;
    });
    state.people = state.people.filter((p) => p.id !== id);
  });
}
function saveExpense(exp) {
  commit(() => {
    const idx = state.expenses.findIndex((e) => e.id === exp.id);
    if (idx >= 0) state.expenses[idx] = exp; else state.expenses.push(exp);
  });
}
function deleteExpense(id) { commit(() => { state.expenses = state.expenses.filter((e) => e.id !== id); }); }
function resetAll() { commit(() => { state.people = []; state.expenses = []; }); tab = "people"; renderApp(); }

/* ---------- screens ---------- */
function summaryView(rows, settlement, total) {
  if (state.expenses.length === 0) {
    const need = state.people.length < 2;
    return empty("wallet", "No expenses yet",
      need ? "Add at least two people, then log a shared cost." : "Log a shared cost to see who owes whom.",
      need ? "Add people" : "Add expense", () => (need ? (tab = "people", renderApp()) : openExpenseSheet(null)));
  }
  const maxAbs = Math.max(1, ...rows.map((r) => Math.abs(r.net)));
  const frag = document.createDocumentFragment();

  frag.append(h("section", { class: "hero" },
    h("span", { class: "hero-brand" }, svg("wallet", 15), "Cost Allocation"),
    h("div", { class: "hero-total" }, fmt(total)),
    h("p", { class: "hero-sub" },
      `Split between ${state.people.length} ${state.people.length === 1 ? "person" : "people"} across ${state.expenses.length} ${state.expenses.length === 1 ? "expense" : "expenses"}.`)));

  frag.append(h("h2", { class: "sec" }, "Who owes what"));
  frag.append(h("div", { class: "list" }, rows.map((r) => {
    const owes = r.net > 0.005, gets = r.net < -0.005;
    const w = (Math.abs(r.net) / maxAbs) * 100;
    const cls = owes ? "owe" : gets ? "recv" : "zero";
    return h("div", { class: "row bal" },
      avatar(r.name, r.i),
      h("div", { class: "bal-mid" },
        h("span", { class: "bal-name" }, r.name),
        h("div", { class: "bar" }, h("span", { class: "bar-fill " + cls, style: { width: w + "%" } }))),
      h("div", { class: "bal-right" },
        h("span", { class: "amt " + cls }, owes ? fmt(r.net) : gets ? fmt(-r.net) : fmt(0)),
        h("span", { class: "amt-tag" }, owes ? "owes" : gets ? "gets back" : "settled")));
  })));

  frag.append(h("h2", { class: "sec" }, "Settle up"));
  if (settlement.length === 0) {
    frag.append(h("div", { class: "settled-note" }, svg("check", 16), "Everyone's square — no payments needed."));
  } else {
    frag.append(h("div", { class: "list" }, settlement.map((t) =>
      h("div", { class: "row pay" },
        h("div", { class: "pay-people" },
          h("span", { class: "pay-p" }, avatar(t.from.name, t.from.i, 28), t.from.name),
          (() => { const a = svg("arrowRight", 16); a.classList.add("pay-arrow"); return a; })(),
          h("span", { class: "pay-p" }, avatar(t.to.name, t.to.i, 28), t.to.name)),
        h("span", { class: "pay-amt" }, fmt(t.amount))))));
  }
  frag.append(h("button", { class: "btn ghost export-btn", onclick: openExportSheet }, svg("download", 18), "Export"));
  frag.append(h("div", { class: "pad" }));
  return frag;
}

function peopleView(rows) {
  if (state.people.length === 0)
    return empty("users", "No one here yet", "Add the people who are splitting costs.", "Add person", () => openPersonSheet(null));
  const frag = document.createDocumentFragment();
  frag.append(h("div", { class: "list" }, rows.map((r) =>
    h("div", { class: "row person" },
      h("button", { class: "person-main", onclick: () => openPersonSheet(r) },
        avatar(r.name, r.i),
        h("div", { class: "person-mid" },
          h("span", { class: "person-name" }, r.name),
          h("span", { class: "person-sub" }, `paid ${fmt(r.paid)} · share ${fmt(r.share)}`))),
      iconBtn("trash", "subtle", () => {
        const cnt = state.expenses.filter((e) => e.paidBy === r.id).length;
        openConfirm({
          title: `Remove ${r.name}?`,
          body: cnt > 0 ? `This also removes ${cnt} expense${cnt > 1 ? "s" : ""} they paid for.` : "They'll be taken out of every expense.",
          confirmText: "Remove", danger: true, onConfirm: () => { deletePerson(r.id); closeOverlay(); },
        });
      })))));
  frag.append(h("button", { class: "add-line", onclick: () => openPersonSheet(null) }, svg("userPlus", 17), "Add another person"));
  frag.append(h("div", { class: "pad" }));
  return frag;
}

function expensesView(rows, byId) {
  if (state.expenses.length === 0) {
    const need = state.people.length < 2;
    return empty("receipt", "No expenses yet",
      need ? "Add at least two people first." : "Add a shared cost to get started.",
      need ? "Add people" : "Add expense", () => (need ? (tab = "people", renderApp()) : openExpenseSheet(null)));
  }
  const frag = document.createDocumentFragment();
  frag.append(h("div", { class: "list" }, state.expenses.map((e) => {
    const payer = byId[e.paidBy];
    const n = e.method === "equal" ? Object.keys(e.participants || {}).length : Object.keys(e.amounts || {}).length;
    return h("button", { class: "row exp", onclick: () => openExpenseSheet(e) },
      avatar(payer ? payer.name : "?", payer ? payer.i : 0),
      h("div", { class: "exp-mid" },
        h("span", { class: "exp-desc" }, e.desc),
        h("span", { class: "exp-sub" }, `${payer ? payer.name : "—"} paid · ${e.method === "equal" ? "equal" : "custom"} · ${n} ${n === 1 ? "person" : "people"}`)),
      h("span", { class: "exp-amt" }, fmt(e.amount)));
  })));
  frag.append(h("button", { class: "add-line", onclick: () => openExpenseSheet(null) }, svg("plus", 17), "Add another expense"));
  frag.append(h("div", { class: "pad" }));
  return frag;
}

/* ---------- app shell ---------- */
const mount = () => document.getElementById("root");
function renderApp() {
  const rows = computeTotals(state.people, state.expenses);
  const settlement = computeSettlement(rows);
  const total = round2(state.expenses.reduce((a, e) => a + (Number(e.amount) || 0), 0));
  const byId = {}; rows.forEach((r) => (byId[r.id] = r));

  const titleFor = { summary: "Balances", people: "People", expenses: "Expenses" }[tab];
  const topRight = (tab === "people" && state.people.length > 0)
    ? iconBtn("rotate", "subtle", () => openConfirm({
        title: "Start over?", body: "This clears everyone and every expense. You can't undo it.",
        confirmText: "Clear everything", danger: true, onConfirm: () => { resetAll(); closeOverlay(); },
      }), "Start over")
    : ((tab === "summary" || tab === "expenses") && state.expenses.length > 0)
      ? iconBtn("download", "subtle", openExportSheet, "Export")
      : null;

  const body = tab === "summary" ? summaryView(rows, settlement, total)
    : tab === "people" ? peopleView(rows) : expensesView(rows, byId);

  const app = h("div", { class: "app" },
    h("header", { class: "topbar" }, h("h1", null, titleFor), topRight),
    h("main", { class: "screen" }, body),
    h("button", { class: "fab", "aria-label": tab === "people" ? "Add person" : "Add expense",
      onclick: () => (tab === "people" ? openPersonSheet(null) : openExpenseSheet(null)) }, svg("plus", 24)),
    h("nav", { class: "tabbar" }, [["summary", "scale", "Balances"], ["people", "users", "People"], ["expenses", "receipt", "Expenses"]].map(([k, ic, l]) =>
      h("button", { class: "tab" + (tab === k ? " on" : ""), onclick: () => { tab = k; renderApp(); } }, svg(ic, 21), h("span", null, l)))));

  mount().replaceChildren(app);
}

/* ---------- overlays ---------- */
function closeOverlay() { const o = document.querySelector(".scrim"); if (o) o.remove(); }
function openSheet(title, actionEl, buildBody) {
  closeOverlay();
  const bodyWrap = h("div", { class: "sheet-body" });
  const sheet = h("div", { class: "sheet", onclick: (e) => e.stopPropagation() },
    h("div", { class: "grab" }),
    h("div", { class: "sheet-head" }, h("h3", null, title),
      h("div", { class: "sheet-head-r" }, actionEl, iconBtn("x", "", closeOverlay))),
    bodyWrap);
  const scrim = h("div", { class: "scrim", onclick: closeOverlay }, sheet);
  document.body.append(scrim);
  buildBody(bodyWrap);
}

function openPersonSheet(initial) {
  openSheet(initial ? "Rename person" : "Add a person", null, (body) => {
    const doSave = () => { const v = input.value.trim(); if (!v) return; initial ? renamePerson(initial.id, v) : addPerson(v); closeOverlay(); };
    const input = h("input", { class: "in", value: initial ? initial.name : "", placeholder: "e.g. Aarav",
      onkeydown: (e) => { if (e.key === "Enter") doSave(); }, oninput: () => { btn.disabled = !input.value.trim(); } });
    const btn = h("button", { class: "btn primary", disabled: !initial, onclick: doSave }, initial ? "Save name" : "Add person");
    body.append(h("div", { class: "field" }, h("label", { class: "lab" }, "Name"), input),
      h("div", { class: "sheet-foot" }, btn));
    setTimeout(() => input.focus(), 60);
  });
}

function openExpenseSheet(initial) {
  const people = state.people.map((p, i) => ({ ...p, i }));
  if (!initial && people.length < 2) { tab = "people"; renderApp(); return; }

  let desc = initial ? initial.desc : "";
  let amount = initial ? String(initial.amount) : "";
  let paidBy = initial ? initial.paidBy : (people[0] && people[0].id) || "";
  let method = initial ? initial.method : "equal";
  const parts = {}; people.forEach((p) => (parts[p.id] = (initial && initial.method === "equal" && initial.participants) ? (initial.participants[p.id] || 0) : 1));
  const amts = {}; people.forEach((p) => (amts[p.id] = (initial && initial.method === "custom" && initial.amounts && initial.amounts[p.id] != null) ? String(initial.amounts[p.id]) : ""));

  const action = initial ? iconBtn("trash", "danger", () => openConfirm({
    title: "Delete this expense?", body: "It'll be removed from the ledger.",
    confirmText: "Delete", danger: true, onConfirm: () => { deleteExpense(initial.id); closeOverlay(); },
  })) : null;

  openSheet(initial ? "Edit expense" : "Add expense", action, (body) => {
    const customInputs = {}, previewSpans = {};
    const splitBox = h("div", { class: "split-list" });
    const remain = h("div", { class: "remain" });
    const saveBtn = h("button", { class: "btn primary", onclick: doSave }, initial ? "Save changes" : "Add expense");

    /* fields */
    const descIn = h("input", { class: "in", value: desc, placeholder: "e.g. Dinner", oninput: (e) => { desc = e.target.value; updateDerived(); } });
    const amountIn = h("input", { class: "in amount-in", inputmode: "decimal", type: "number", min: "0", value: amount, placeholder: "0",
      oninput: (e) => { amount = e.target.value; if (method === "equal") renderSplit(); updateDerived(); } });

    const chipRow = h("div", { class: "chips" });
    function renderChips() {
      chipRow.replaceChildren(...people.map((p) =>
        h("button", { class: "chip" + (paidBy === p.id ? " on" : ""), onclick: () => { paidBy = p.id; renderChips(); updateDerived(); } },
          avatar(p.name, p.i, 22), p.name)));
    }
    renderChips();

    const seg = h("div", { class: "seg" },
      h("button", { class: "seg-b" + (method === "equal" ? " on" : ""), onclick: () => setMethod("equal") }, svg("scale", 16), "Split equally"),
      h("button", { class: "seg-b" + (method === "custom" ? " on" : ""), onclick: () => setMethod("custom") }, svg("pencil", 16), "Enter amounts"));
    function setMethod(m) {
      method = m;
      seg.children[0].className = "seg-b" + (m === "equal" ? " on" : "");
      seg.children[1].className = "seg-b" + (m === "custom" ? " on" : "");
      renderSplit(); updateDerived();
    }

    function currentExp() {
      return method === "equal"
        ? { amount: Number(amount) || 0, method: "equal", participants: parts }
        : { amount: Number(amount) || 0, method: "custom", amounts: Object.fromEntries(Object.entries(amts).map(([k, v]) => [k, Number(v) || 0])) };
    }

    function renderSplit() {
      const alloc = allocationFor(currentExp(), people);
      const rows = people.map((p) => {
        if (method === "equal") {
          const inc = parts[p.id] > 0;
          const prev = h("span", { class: "prev" + (inc ? "" : " off") }, inc ? fmt(alloc[p.id]) : "—");
          previewSpans[p.id] = prev;
          const right = h("div", { class: "split-right" });
          if (inc) {
            right.append(h("div", { class: "stepper" },
              h("button", { disabled: parts[p.id] <= 1, onclick: (ev) => { ev.stopPropagation(); parts[p.id] = Math.max(0, parts[p.id] - 1); renderSplit(); updateDerived(); } }, svg("minus", 13)),
              h("span", { class: "cnt" }, String(parts[p.id]), h("em", null, parts[p.id] > 1 ? " shares" : " share")),
              h("button", { onclick: (ev) => { ev.stopPropagation(); parts[p.id] = (parts[p.id] || 0) + 1; renderSplit(); updateDerived(); } }, svg("plus", 13))));
          }
          right.append(prev);
          const tick = h("span", { class: "tick" + (inc ? " on" : "") }, inc ? svg("check", 13) : null);
          return h("div", { class: "split-row" + (inc ? " inc" : "") },
            h("button", { class: "split-main", onclick: () => { parts[p.id] = parts[p.id] > 0 ? 0 : 1; renderSplit(); updateDerived(); } },
              tick, avatar(p.name, p.i, 30), h("span", { class: "split-name" }, p.name)),
            right);
        } else {
          const input = h("input", { class: "mini-in", inputmode: "decimal", type: "number", min: "0", value: amts[p.id], placeholder: "0",
            oninput: (e) => { amts[p.id] = e.target.value; updateDerived(); } });
          customInputs[p.id] = input;
          const inc = (Number(amts[p.id]) || 0) > 0;
          return h("div", { class: "split-row" + (inc ? " inc" : "") },
            h("div", { class: "split-main static" }, avatar(p.name, p.i, 30), h("span", { class: "split-name" }, p.name)),
            h("div", { class: "mini-amt" }, (() => { const ic = svg("rupee", 13); ic.classList.add("mini-ic"); return ic; })(), input));
        }
      });
      splitBox.replaceChildren(...rows);
      remain.style.display = method === "custom" ? "" : "none";
    }

    function updateDerived() {
      const amt = Number(amount) || 0;
      let canSave = !!desc.trim() && amt > 0 && !!paidBy;
      if (method === "equal") {
        const totalShares = Object.values(parts).reduce((a, b) => a + (Number(b) || 0), 0);
        canSave = canSave && totalShares > 0;
        const alloc = allocationFor(currentExp(), people);
        for (const id in previewSpans) if (parts[id] > 0) previewSpans[id].textContent = fmt(alloc[id]);
      } else {
        const sum = round2(Object.values(amts).reduce((a, b) => a + (Number(b) || 0), 0));
        const rem = round2(amt - sum);
        canSave = canSave && Math.abs(rem) < 0.01 && sum > 0;
        remain.className = "remain " + (Math.abs(rem) < 0.01 ? "ok" : rem > 0 ? "under" : "over");
        remain.replaceChildren(
          h("span", null, Math.abs(rem) < 0.01 ? "Balanced" : rem > 0 ? `${fmt(rem)} left to assign` : `${fmt(-rem)} over the total`),
          h("button", { class: "link", disabled: amt <= 0, onclick: splitRest }, "Split equally"));
      }
      saveBtn.disabled = !canSave;
    }

    function splitRest() {
      const amt = Number(amount) || 0; if (amt <= 0) return;
      const each = round2(amt / people.length); let acc = 0;
      people.forEach((p, k) => { const v = k === people.length - 1 ? round2(amt - acc) : each; acc = round2(acc + each); amts[p.id] = String(v); if (customInputs[p.id]) customInputs[p.id].value = String(v); });
      updateDerived();
    }

    function doSave() {
      const amt = round2(Number(amount) || 0);
      const exp = { id: initial ? initial.id : uid(), desc: desc.trim(), amount: amt, paidBy, method };
      if (method === "equal") exp.participants = Object.fromEntries(Object.entries(parts).filter(([, v]) => v > 0));
      else exp.amounts = Object.fromEntries(Object.entries(amts).map(([k, v]) => [k, round2(Number(v) || 0)]).filter(([, v]) => v > 0));
      saveExpense(exp); closeOverlay();
    }

    body.append(
      h("div", { class: "field" }, h("label", { class: "lab" }, "What was it for?"), descIn),
      h("div", { class: "field" }, h("label", { class: "lab" }, "Total amount"),
        h("div", { class: "amount-wrap" }, (() => { const ic = svg("rupee", 20); ic.classList.add("amount-ic"); return ic; })(), amountIn)),
      h("div", { class: "field" }, h("label", { class: "lab" }, "Paid by"), chipRow),
      h("div", { class: "field" }, h("label", { class: "lab" }, "How to split"), seg),
      splitBox, remain,
      h("div", { class: "sheet-foot" }, saveBtn));

    renderSplit(); updateDerived();
    setTimeout(() => descIn.focus(), 60);
  });
}

function openConfirm(o) {
  closeOverlay();
  const dialog = h("div", { class: "dialog", onclick: (e) => e.stopPropagation() },
    h("h4", null, o.title), h("p", null, o.body),
    h("div", { class: "dialog-foot" },
      h("button", { class: "btn ghost", onclick: closeOverlay }, "Cancel"),
      h("button", { class: "btn " + (o.danger ? "danger-solid" : "primary"), onclick: o.onConfirm }, o.confirmText)));
  document.body.append(h("div", { class: "scrim center", onclick: closeOverlay }, dialog));
}

/* ---------- go ---------- */
renderApp();
</script>
</body>
</html>
